name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: assetpool
          POSTGRES_PASSWORD: assetpool
          POSTGRES_DB: it_assets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetpool"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://assetpool:assetpool@localhost:5432/it_assets_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-123
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-12
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI lint (НВ-5)
        run: pnpm --filter @assetpool/schema lint
      - run: pnpm generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @assetpool/api exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: pnpm --filter @assetpool/web exec playwright install --with-deps
      - run: pnpm --filter @assetpool/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          SKIP_DB_RESET: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - if: always()
        run: docker compose logs && docker compose down -v

  docker-build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (НВ-6 — перевірка збірки)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
